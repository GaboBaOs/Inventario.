<!DOCTYPE html>
<html>
<head>
    <title>Inventario de productos</title>
</head>

<body>

    <label for="codigo">Codigo:</label>
    <input type="text" id="codigo" placeholder="codigo del producto">
    <br>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" placeholder="nombre del producto">
    <br>
    <label for="cantidad">Cantidad:</label>
    <input type="number" id="cantidad" placeholder="cantidad del producto">
    <br>
    <label for="costo">Costo:</label>
    <input type="number" id="costo" placeholder="costo del producto">
    <br>
    <label for="posicion">Posicion:</label>
    <input type="number" id="posicion" placeholder="posicion del producto">
    <br>
    <button onclick="agregarProducto()">Agregar</button>
    <button onclick="buscarProducto()">Buscar</button>
    <button onclick="eliminarProducto()">Eliminar</button>
    <button onclick="insertarProducto()">Insertar</button>
    <button onclick="listarProductos()">Listar</button>
    <button onclick="listarInverso()">Listar Inverso</button>
    <br><br>
    <div id="resultado"></div>
    <script src="Producto.js"></script>
    <script src="Inventario.js"></script>

    <script>

        let inventario = new Inventario();
        function agregarProducto() {
            let codigo = document.getElementById("codigo").value;
            let nombre = document.getElementById("nombre").value;
            let cantidad = document.getElementById("cantidad").value;
            let costo = document.getElementById("costo").value;
            if (codigo == "" || nombre == "" || cantidad == "" || costo == "") {
                document.getElementById("resultado").innerHTML =
                    "Debes llenar todos los datos del producto";
                return;
            }
            let producto = new Producto(codigo, nombre, cantidad, costo);
            inventario.agregar(producto);
            document.getElementById("resultado").innerHTML =
                "Producto agregado";
        }
        function buscarProducto() {
            let codigo = document.getElementById("codigo").value;
            let producto = inventario.buscar(codigo);
            if (producto !== undefined) {
                document.getElementById("resultado").innerHTML =
                    producto.infoHtml();
            } else {
                document.getElementById("resultado").innerHTML =
                    "Producto no encontrado";
            }
        }
        function eliminarProducto() {
            let codigo = document.getElementById("codigo").value;
            let producto = inventario.eliminar(codigo);
            if (producto !== undefined) {
                document.getElementById("resultado").innerHTML =
                    "Producto eliminado";
            } else {
                document.getElementById("resultado").innerHTML =
                    "Producto no encontrado";
            }
        }
        function insertarProducto() {
            let codigo = document.getElementById("codigo").value;
            let nombre = document.getElementById("nombre").value;
            let cantidad = document.getElementById("cantidad").value;
            let costo = document.getElementById("costo").value;
            let posicion = document.getElementById("posicion").value;
            if (codigo == "" || nombre == "" || cantidad == "" || costo == "" || posicion == "") {
                document.getElementById("resultado").innerHTML =
                    "Debes llenar todos los datos";
                return;
            }
            let producto = new Producto(codigo, nombre, cantidad, costo);
            inventario.insertar(producto, posicion);
            document.getElementById("resultado").innerHTML =
                "Producto insertado";
        }
        function listarProductos() {
            document.getElementById("resultado").innerHTML =
                inventario.listar();
        }
        function listarInverso() {
            document.getElementById("resultado").innerHTML =
                inventario.listarInverso();
        }

    </script>

</body>
</html>
